[package]
name = "bdk_esplora"
version = "0.22.1"
edition = "2021"
rust-version = "1.85.0"
homepage = "https://bitcoindevkit.org"
repository = "https://github.com/bitcoindevkit/bdk"
documentation = "https://docs.rs/bdk_esplora"
description = "Fetch data from esplora in the form that accepts"
license = "MIT OR Apache-2.0"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
bdk_core = { path = "../core", version = "0.6.1", default-features = false }
async-trait = { version = "0.1.66", optional = true }
futures = { version = "0.3.26", optional = true }
serde_json = { version = "1.0", features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
esplora-client-native = { package = "esplora-client", git = "https://github.com/bitcoindevkit/rust-esplora-client.git", rev = "e0d47ea14de294dad6a6fea785f9e41fb50d8e7f", version = "0.13.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
esplora-client-wasm = { package = "esplora-client", version = "0.12.3", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bdk_chain = { path = "../chain" }
bdk_testenv = { path = "../testenv" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = ["std", "async-https", "blocking-https"]
std = ["bdk_core/std"]
tokio = ["esplora-client-native/tokio", "esplora-client-wasm/tokio"]
async = ["async-trait", "futures", "esplora-client-native/async", "esplora-client-wasm/async"]
async-https = ["async", "esplora-client-native/async-https"]
async-https-rustls = ["async", "esplora-client-native/async-https-rustls"]
async-https-native = ["async", "esplora-client-native/async-https-native"]
blocking = ["esplora-client-native/blocking"]
blocking-https = ["blocking", "esplora-client-native/blocking-https"]
blocking-https-rustls = ["blocking", "esplora-client-native/blocking-https-rustls"]
blocking-https-native = ["blocking", "esplora-client-native/blocking-https-native"]

[[test]]
name = "blocking_ext"
required-features = ["blocking"]

[[test]]
name = "async_ext"
required-features = ["async"]
